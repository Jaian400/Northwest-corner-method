<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metoda Wierzchołka Północno-Zachodniego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
</head>
<body class="bg-body-tertiary">

<button id="theme-toggle" class="btn btn-outline-secondary position-fixed top-0 end-0 m-3 z-3 shadow-sm">
    <span id="theme-icon"></span> <span id="theme-text">Ciemny</span>
</button>

<div class="container mt-3">
    <div class="">
        <h2 class="text-center mb-4">Metoda Wierzchołka Północno-Zachodniego</h2>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title">Podaj wymiary problemu</h5>
            <div class="row g-3 align-items-center">
                <div class="col-auto">
                    <label for="rows" class="col-form-label">Liczba dostawców (Podaż):</label>
                </div>
                <div class="col-auto">
                    <input type="number" id="rows" class="form-control" value="3" min="1">
                </div>
                <div class="col-auto">
                    <label for="cols" class="col-form-label">Liczba odbiorców (Popyt):</label>
                </div>
                <div class="col-auto">
                    <input type="number" id="cols" class="form-control" value="4" min="1">
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-secondary" onclick="generateTable()">Generuj tabelę</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm" id="matrix-card" style="display: none;">
        <div class="card-body">
            <h5 class="card-title">Uzupełnij koszty transportu, podaż i popyt</h5>
            
            <form id="solver-form">
                <input type="hidden" id="hidden-rows" name="num_rows">
                <input type="hidden" id="hidden-cols" name="num_cols">

                <div class="table-responsive">
                    <table class="table table-bordered text-center align-middle" id="input-table">
                    </table>
                </div>

                <br>

                <div class="row g-4"> 
        
                    <div class="col-md-6">
                        <div class="table-responsive">
                            <table class="table table-bordered text-center align-middle" id="input-table-2">
                            </table>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="table-responsive">
                            <table class="table table-bordered text-center align-middle" id="input-table-3">
                            </table>
                        </div>
                    </div>

                </div>
                
                <button type="submit" class="btn btn-primary w-100 mt-3">Rozwiąż</button>
            </form>
        </div>
    </div>

    <div class="card mt-4 mb-4" id="results-main" style="display: none;">
        <div class="card-body">
            <h4 class="card-title text-center">Wizualizacja Tras</h4>
            <div id="network-graph" style="height: 500px; border: 1px solid lightgray"></div>
        </div>
    </div>

    <div class="card mt-4 mb-4" id="results-container" style="display: none;">
        <div class="card shadow-lg">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">WYNIK</h3>
                <div id="results-table-container"></div>
            </div>
        </div>
    </div>

</div>

<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<script>
    document.getElementById('solver-form').addEventListener('submit', function(event) {
        event.preventDefault(); 

        const formData = new FormData(this);

        const rows = parseInt(document.getElementById('rows').value);
        const blocked = [];

        for (let i = 0; i < rows; i++) {
            const key = `blocked_supplier_${i}`;
            
            if (formData.has(key)) {
                blocked.push(i); 
                formData.delete(key); 
            }
        }
        formData.append('blocked_suppliers', JSON.stringify(blocked));

        console.clear();
        const dataToSend = Object.fromEntries(formData.entries());
        console.table(dataToSend);

        fetch('/p/solve-nw-c', {
            method: 'POST',
            body: formData 
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('Błąd serwera');
            }
            return response.json(); 
        })
        .then(data => { 
            console.log(JSON.stringify(data, null, 2));
            document.getElementById('results-container').style.display = 'block';
            const tableHTML = renderResultsTable(data);
            renderGraph(data);
            document.getElementById('results-table-container').innerHTML = tableHTML;
            // document.getElementById('json-output').textContent = JSON.stringify(data, null, 4);
            document.getElementById('results-main').style.display = 'block';
            document.getElementById('results-main').scrollIntoView({ behavior: 'smooth' });
        })
        .catch(error => {
            console.error('Wystąpił błąd:', error);
            alert("Coś poszło nie tak podczas obliczeń!");
        });
    });

    document.addEventListener('DOMContentLoaded', () => {
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');
        const htmlElement = document.documentElement; 
        
        const savedTheme = localStorage.getItem('app-theme') || 'light';
        
        applyTheme(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            applyTheme(newTheme);
        });

        function applyTheme(theme) {
            htmlElement.setAttribute('data-bs-theme', theme);
            
            localStorage.setItem('app-theme', theme);

            if (theme === 'dark') {
                themeText.textContent = 'Jasny';
                themeToggleBtn.classList.replace('btn-outline-secondary', 'btn-outline-light');
            } else {
                themeText.textContent = 'Ciemny';
                themeToggleBtn.classList.replace('btn-outline-light', 'btn-outline-secondary');
            }
        }
    });

    var table;

    function addRow(){

    }

    function addCol(){

    }

    function generateTable() {
        const rows = parseInt(document.getElementById('rows').value);
        const cols = parseInt(document.getElementById('cols').value);
        
        document.getElementById('hidden-rows').value = rows;
        document.getElementById('hidden-cols').value = cols;

        let table = '<thead><tr><th>Koszty</th>';
        
        for (let j = 0; j < cols; j++) {
            table += `<th>Odbiorca ${j + 1} </th>`;
        }
        table += '<th class=""bg-body-tertiary">Podaż</th></tr></thead><tbody>';

        for (let i = 0; i < rows; i++) {
            table += `<tr><th>Dostawca ${i + 1} <br> Blokada: <input type="checkbox" name="blocked_supplier_${i}" value="true" class=""></th>`;
            for (let j = 0; j < cols; j++) {
                table += `<td><input type="number" name="cost_${i}_${j}" class="form-control" required></td>`;
            }
            table += `<td class="bg-body-tertiary"><input type="number" name="supply_${i}" class="form-control" required></td></tr>`;
        }

        table += '</tbody><tfoot><tr><th class=""bg-body-tertiary">Popyt</th>';
        for (let j = 0; j < cols; j++) {
            table += `<td class=""bg-body-tertiary"><input type="number" name="demand_${j}" class="form-control" required></td>`;
        }
        table += '<td class=""bg-body-tertiary"></td></tr></tfoot>';

        document.getElementById('input-table').innerHTML = table;
        document.getElementById('matrix-card').style.display = 'block';

        generateTable2(rows, cols);
        generateTable3(rows, cols);
    }

    function generateTable2(rows, cols) {
        let table = '<thead><tr><th class="align-middle bg-body-tertiary"></th>';
        table += `<th class="align-middle">Cena zakupu</th></tr></thead><tbody>`;

        for (let i = 0; i < rows; i++) {
            table += `<tr><th class="align-middle bg-body-tertiary">Dostawca ${i + 1}</th>`;
            table += `<td><input type="number" name="buying_price_${i}" class="form-control" required></td>`;
            table += `</tr>`;
        }
        table += '</tbody>';

        document.getElementById('input-table-2').innerHTML = table;
    }

    function generateTable3(rows, cols) {
        let table = '<thead><tr><th class="align-middle bg-body-tertiary"></th>';
        table += `<th class="align-middle">Cena sprzedaży</th></tr></thead><tbody>`;

        for (let j = 0; j < cols; j++) {
            table += `<tr><th class="align-middle bg-body-tertiary">Odbiorca ${j + 1}</th>`;
            table += `<td><input type="number" name="selling_price_${j}" class="form-control" required></td>`;
            table += `</tr>`;
        }
        table += '</tbody>';

        document.getElementById('input-table-3').innerHTML = table;
    }

    function renderResultsTable(data) {
        const idx_FD = data.supply.length;       
        const idx_Beta = data.supply.length + 1;
        const rows = idx_Beta + 1;

        const idx_FO = data.demand.length;     
        const idx_Alfa = data.demand.length + 1;
        const cols = idx_Alfa + 1;

        let html = '<div class="table-responsive"><table class="table table-bordered text-center align-middle">';

        html += '<thead><tr><th class="bg-body-tertiary"></th>';
        for (let j = 0; j < cols; j++) {
            if (j === idx_FO) {
                html += `<th>FO</th>`;
            } else if (j === idx_Alfa) {
                html += `<th>Alfa</th>`;
            } else {
                html += `<th>Odbiorca ${j + 1}</th>`;
            }   
        }
        html += '<th class="bg-body-tertiary">Podaż</th></tr></thead><tbody>';

        for (let i = 0; i < rows; i++) {
            if (i === idx_FD) {
                html += `<tr><th class="bg-body-tertiary">FD</th>`;
            } else if (i === idx_Beta) {
                html += `<tr><th class="bg-body-tertiary">Beta</th>`;
            } else {
                html += `<tr><th class="bg-body-tertiary">Dostawca ${i + 1}</th>`;
            } 
            
            for (let j = 0; j < cols; j++) {
                
                if (i === idx_Beta && j === idx_Alfa) {
                    html += `<td></td>`;
                    
                } else if (i === idx_Beta) {
                    const v_val = (data.v && data.v[j] !== undefined) ? data.v[j] : '-';
                    html += `<td class="bg-body-tertiary"><br><strong class="fs-5">${v_val}</strong><br><br></td>`;
                    
                } else if (j === idx_Alfa) {
                    const u_val = (data.u && data.u[i] !== undefined) ? data.u[i] : '-';
                    html += `<td class="bg-body-tertiary"><br><strong class="fs-5">${u_val}</strong><br><br></td>`;
                    
                } else {
                    const alloc = data.allocations?.[i]?.[j] || 0;
                    const profit = data.profit?.[i]?.[j] || 0;

                    html += `<td>
                                <div class="text-end text-muted mb-1" style="font-size: 0.75rem;">zysk: ${profit}</div>
                                <strong class="fs-5">${alloc > 0 ? alloc : '0'}</strong><br>`;
                    
                    let delta = '';
                    if (data.reduced_costs) {
                        for (let c of data.reduced_costs) {
                            if (c.cell[0] === i && c.cell[1] === j) {
                                delta = c.reduced_profit;
                                break;
                            }
                        }
                    }

                    if (delta !== '') {
                        html += `<div class="text-end mt-1" style="font-size: 0.75rem;">delta: ${delta}</div>`;
                    } else {
                        html += `<div class="mt-1" style="font-size: 0.75rem;">&nbsp;</div>`;
                    }

                    html += `</td>`; 
                }
            }
            
            if (i === idx_FD) {
                let num = 0;
                if (data.allocations && data.allocations[i]) {
                    num = data.allocations[i].reduce((a, b) => a + b, 0);
                }
                html += `<td class="bg-body-tertiary fw-bold">${num}</td></tr>`;
                
            } else if (i === idx_Beta) {
                html += `<td class="bg-body-tertiary"></td></tr>`;
                
            } else {
                html += `<td class="bg-body-tertiary fw-bold">${data.supply[i]}</td></tr>`;
            } 
        }

        html += '</tbody><tfoot><tr><th class="bg-body-tertiary">Popyt</th>';
        for (let j = 0; j < cols; j++) {
            
            if (j === idx_Alfa) {
                html += `<td class="bg-body-tertiary"></td>`;
                
            } else if (j === idx_FO) {
                let num = 0;
                for (let i = 0; i < idx_Beta; i++) {
                    num += data.allocations?.[i]?.[j] || 0;
                }
                html += `<td class="bg-body-tertiary fw-bold">${num}</td>`;
                
            } else {
                html += `<td class="bg-body-tertiary fw-bold">${data.demand[j]}</td>`;
            } 
        }
        html += '<td class="bg-body-tertiary"></td></tr></tfoot></table></div>';

        return html;
    }

    function renderGraph(data) {
        const container = document.getElementById('network-graph');
        
        let nodes = [];
        let edges = [];

        const numRows = data.supply.length;
        const numCols = data.demand.length;

        for (let i = 0; i < numRows; i++) {
            nodes.push({
                id: `S${i}`, 
                label: `Dostawca ${i+1}\n(Podaż: ${data.supply[i]})`, 
                color: '#ffcccc',
                shape: 'box'
            });
        }

        for (let j = 0; j < numCols; j++) {
            nodes.push({
                id: `D${j}`, 
                label: `Odbiorca ${j+1}\n(Popyt: ${data.demand[j]})`, 
                color: '#ccffcc', 
                shape: 'ellipse'
            });
        }

        for (let i = 0; i < numRows; i++) {
            for (let j = 0; j < numCols; j++) {
                let alloc = data.allocations[i][j];
                
                if (alloc > 0) {
                    edges.push({
                        from: `S${i}`,
                        to: `D${j}`,
                        label: `${alloc}`,
                        arrows: 'to',
                        font: { size: 16, align: 'middle', strokeWidth: 2 },
                        color: { color: '#007bff' },
                        width: 2
                    });
                }
            }
        }

        const graphData = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
        const options = {
            physics: { enabled: true }, 
            layout: {
                hierarchical: {
                    direction: 'LR',
                    sortMethod: 'directed',
                    nodeSpacing: 250
                }
            }
        };
        
        new vis.Network(container, graphData, options);
    }

    window.onload = generateTable;
</script>

</body>
</html>
